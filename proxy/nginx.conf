# nginx reverse proxy for the live-stream-radio web console.
# Use this instead of the Caddyfile if nginx already runs on the server.
#
# 1. Point a DNS record (e.g. radio.example.com) at this server, and open ports 80 and 443.
# 2. Replace radio.example.com below, and 8000 if you changed api.port.
# 3. In your project's config.json, keep "host": "localhost" and add "trust_proxy": true
#    to the "api" section, then restart live-stream-radio.
# 4. Install it as a site:
#      sudo cp nginx.conf /etc/nginx/sites-available/live-stream-radio
#      sudo ln -s /etc/nginx/sites-available/live-stream-radio /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# 5. Add HTTPS straight away (until then the console is plain http, don't sign in yet):
#      sudo apt install certbot python3-certbot-nginx
#      sudo certbot --nginx -d radio.example.com
#    certbot adds the certificate and the http -> https redirect to this file, and renews it.
# 6. Open https://radio.example.com

server {
    listen 80;
    listen [::]:80;
    server_name radio.example.com;

    # The console lives at /console
    location = / {
        return 302 /console;
    }

    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, don't append, so visitors can't fake their address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;
}
